name: Shellcheck

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        run: find . -name '*.sh' -print0 | xargs -0 shellcheck --shell=bash -e SC1090 -e SC1091
